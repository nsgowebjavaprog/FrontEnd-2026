<!-- Advanced Level -->

<h1>rowspan & colspan</h1>
<table border="1">

    <thead>
        <tr>
            <td>Level-1</td>
            <td>Level-2</td>
            <td>Level-3</td>
            <td>Level-4</td>
            <td>Level-5</td>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td rowspan="6">System</td>
            <td rowspan="4">System Apps</td>
            <td rowspan="3">System Env</td>
            <td>App Test</td>
            <td rowspan="2">Foo</td>
        </tr>

        <tr>
            <td> App Memory</td>
        </tr>

        <tr>
            <td>App Test</td>
            <td rowspan="2">Foo</td>
        </tr>

        <tr>
            <td>App Memory-2</td>
            <td>App Memory</td>
        </tr>

        <tr>
            <td rowspan="2", colspan="2">System memory</td>
            <td>Memory</td>
            <td>Foo</td>
        </tr>

        <tr>
            <td>App Test</td>
            <td>Foo</td>
        </tr>

    </tbody>

</table>
