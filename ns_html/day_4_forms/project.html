<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>University Registration Form</h1>

    <p>Please fill out the form below to register</p>

    <hr>
    <h2>Personal Details</h2>

    <form>
        <label for="name">First Name: </label>
        <input type="text" name="name" id="name" placeholder="enter the name">
        
        <br><br>
        <label >Last Name: </label>
        <input type="text" placeholder="enter the name">

        <br><br>
        <label >Date of Birth: </label>
        <input type="date">

        <br><br>
        <label> Gender: </label>
        <br><br>

        <label for="male">male</label>
        <input type="radio" name="gender" id="male" value="male">
        <br><br>

        <label for="female">female</label>
        <input type="radio">
        <br><br>

        <label for="other">other</label>
        <input type="radio">
        <br><br>

        <lable>Upload your Photo:</lable>
        <br><br>
        <input type="file">

        <hr>

        <h2>Contact Details: </h2>

        <label>Address: </label>
        <br><br>
        <textarea name="adr" id="adr"></textarea>


        <hr>
        <h2>IMP Selection with dropDown</h2>
        <hr>
        <label for="course">Select Course: </label>
            <select name="course" id="course">
                <option value="cse">CSE</option>
                <option value="cse">EEE</option>
                <option value="cse">ECE</option>
            </select>

    </form>


</body>
</html>
